{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - PROTISRUTI{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-container">
        <h2>Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary">Login</button>
            </div>
        </form>
        <div class="auth-option">
            <p>Don't have an account? <a href="{% url 'login_options' %}">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
